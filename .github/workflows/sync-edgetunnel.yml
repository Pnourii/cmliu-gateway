name: Sync EdgeTunnel upstream

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/sync-edgetunnel.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download latest EdgeTunnel files
        run: |
          curl -fsSL https://raw.githubusercontent.com/cmliu/edgetunnel/main/_worker.js -o _worker.js
          curl -fsSL https://raw.githubusercontent.com/cmliu/edgetunnel/main/CHANGELOG -o CHANGELOG

      - name: Commit upstream changes
        run: |
          if git diff --quiet -- _worker.js CHANGELOG; then
            echo "Already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add _worker.js CHANGELOG
          git commit -m "Sync EdgeTunnel upstream"
          git push
